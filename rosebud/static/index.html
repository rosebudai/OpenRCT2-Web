<!DOCTYPE html>
<html>
<head>
    <title>OpenRCT2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" crossorigin=anonymous></script>
    <style>
        * { padding: 0; margin: 0; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        #loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #loading-logo {
            width: 96px;
            height: 96px;
            margin-bottom: 24px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(232, 121, 121, 0.3)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(232, 121, 121, 0.6)); }
        }
        #loading-message {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            font-style: italic;
            color: #c8b8a0;
            height: 24px;
            margin-bottom: 24px;
            transition: opacity 0.4s ease;
        }
        #loading-bar-track {
            width: 320px;
            height: 14px;
            background: #2a2a4a;
            border-radius: 7px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        #loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e87979, #e8a079);
            border-radius: 7px;
            transition: width 0.3s ease;
        }
        #loading-phase {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            color: #8a8aaa;
            margin-top: 12px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            position: fixed;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

        <div id="loading-message">Building the perfect roller coaster...</div>
        <div id="loading-bar-track">
            <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-phase">Initializing...</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        (() => {
            const phrases = [
                "Building the perfect roller coaster...",
                "Guests are lining up at the entrance...",
                "Hiring handymen and mechanics...",
                "Testing the log flume for safety...",
                "Rosie is landscaping your park...",
                "Convincing Mr. Bones the ride never ends...",
                "Placing benches near the nausea zones..."
            ];
            let phraseIndex = 0;
            const msgEl = document.getElementById("loading-message");
            const phraseInterval = setInterval(() => {
                msgEl.style.opacity = "0";
                setTimeout(() => {
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    msgEl.textContent = phrases[phraseIndex];
                    msgEl.style.opacity = "1";
                }, 400);
            }, 4000);

            window._loadingPhraseInterval = phraseInterval;

            window.updateLoadingBar = function(pct, phase) {
                const fill = document.getElementById("loading-bar-fill");
                const phaseEl = document.getElementById("loading-phase");
                if (fill) fill.style.width = pct + "%";
                if (phaseEl) phaseEl.textContent = phase;
            };

            window.showLoadingError = function(msg) {
                clearInterval(phraseInterval);
                const msgEl = document.getElementById("loading-message");
                const track = document.getElementById("loading-bar-track");
                const phaseEl = document.getElementById("loading-phase");
                if (msgEl) {
                    msgEl.style.fontStyle = "normal";
                    msgEl.style.color = "#ffffff";
                    msgEl.style.height = "auto";
                    msgEl.textContent = msg;
                    msgEl.style.opacity = "1";
                }
                if (track) track.style.display = "none";
                if (phaseEl) phaseEl.style.display = "none";
            };

            window.dismissOverlay = function() {
                updateLoadingBar(100, "Opening the gates!");
                clearInterval(phraseInterval);
                // Canvas must be visible BEFORE callMain() — game needs
                // non-zero dimensions when initializing its GL context.
                const canvas = document.getElementById("canvas");
                if (canvas) canvas.style.display = "";
                // Reset body flex layout — it centers the overlay but shifts
                // the fixed-position canvas off-screen by half the viewport.
                document.body.style.display = "block";
                setTimeout(() => {
                    const overlay = document.getElementById("loading-overlay");
                    if (overlay) {
                        overlay.classList.add("fade-out");
                        overlay.addEventListener("transitionend", () => {
                            overlay.remove();
                        });
                    }
                }, 300);
            };
        })();
    </script>
    <script src="index.js"></script>
</body>
